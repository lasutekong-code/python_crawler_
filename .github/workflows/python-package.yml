name: Daily News Crawler

on:
  schedule:
    - cron: '0 21 * * *'   # 매일 06:00(KST) 자동 실행
  workflow_dispatch:        # Actions 탭 수동 실행 버튼 추가

permissions:
  contents: write            # 저장소에 커밋·푸시할 권한 부여

jobs:
  crawl:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install dependencies
        run: |
          set -euo pipefail
          echo "[install] Starting dependency installation"
          python --version
          pip --version
          pip install -r requirements.txt
          echo "[install] Dependency installation completed"
      - name: Run crawler
        run: |
          set -euo pipefail
          echo "[crawl] Starting news crawl"
          python crawl_news.py
          echo "[crawl] News crawl completed"
      - name: Commit and push changes
        run: |
          set -euo pipefail
          echo "[git] Preparing commit"
          git config --global user.name 'github-actions'
          git config --global user.email 'actions@github.com'
          git add docs/index.md
          if git diff --cached --quiet; then
            echo "[git] No content changes to commit."
            exit 0
          fi
          git commit -m "Update news"
          echo "[git] Pushing updated docs/index.md"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
          echo "[git] Push completed"
